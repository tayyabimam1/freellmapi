name: Sync upstream

on:
  schedule:
    # Runs hourly (UTC time). GitHub may delay it a few minutes under load.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream (tashfeenahmed/freellmapi)
        uses: peter-evans/repo-sync@v3
        with:
          source_repo: https://github.com/tashfeenahmed/freellmapi.git
          source_branch: main
          destination_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
