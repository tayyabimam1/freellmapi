name: Sync upstream

on:
  schedule:
    # Runs hourly (UTC time). GitHub may delay it a few minutes under load.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Uses the repo-scoped write deploy key (DEPLOY_KEY secret) because
      # GITHUB_TOKEN is not allowed to push changes to workflow files.
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Merge upstream/main into fork main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tashfeenahmed/freellmapi.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork is already up to date with upstream."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin main
          echo "Fork updated from upstream."
