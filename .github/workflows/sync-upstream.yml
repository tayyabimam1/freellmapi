name: Sync upstream

on:
  schedule:
    # Runs hourly (UTC time). GitHub may delay it a few minutes under load.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main from upstream tashfeenahmed/freellmapi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=$(gh api -X POST repos/tayyabimam1/freellmapi/merge-upstream \
            -f branch=main --jq '.merge_type')
          case "$result" in
            merge|fast-forward) echo "Fork updated from upstream ($result)." ;;
            none) echo "Fork is already up to date with upstream." ;;
            *) echo "Unexpected merge_type: $result"; exit 1 ;;
          esac
